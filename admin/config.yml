backend:
  name: git-gateway
  branch: main
media_folder: "assets/images/products"
public_folder: "/assets/images/products"
collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Product Title", name: "title", widget: "string"}
      - {label: "Slug(英文链接名，小写，无空格)", name: "slug", widget: "string"}
      - {label: "Main Image", name: "image", widget: "image"}
      - {label: "一级分类", name: "category_1", widget: "select", options: ["Custom Bags", "Promotional Event Products"]}
      - {label: "二级分类（自由输入）", name: "category_2", widget: "string"}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "WhatsApp链接", name: "whatsapp", widget: "string"}
      - {label: "是否精选（勾选才会显示在首页）", name: "featured", widget: "boolean", default: false}
  - name: "settings"
    label: "Global Site Settings"
    files:
      - label: "Contact Info"
        name: "contact"
        file: "content/settings/contact.json"
        fields:
          - {label: "Company Name", name: "company_name", widget: "string"}
          - label: "WhatsApp Numbers"
            name: whatsapp_numbers
            widget: list
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Number(+86...)", name: "number", widget: "string"}
          - {label: "Email", name: "email", widget: "string", required: false}
          - {label: "Phone", name: "phone", widget: "string", required: false}
          - label: "WeChat IDs"
            name: wechat_ids
            widget: list
            required: false
            fields:
              - {label: "WeChat ID", name: "id", widget: "string"}
          - {label: "Business Hours", name: "business_hours", widget: "string", required: false}

