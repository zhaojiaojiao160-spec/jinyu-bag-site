    <style>
        :root{
            --bg:#FFFFFF; --bg-soft:#F2F5FA; --primary:#1E3A5F; --primary-dark:#102A43;
            --accent:#E8A33D; --text:#1F2430; --muted:#5B6472; --line:#DCE4EC;
            --radius:16px;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;}
        body{color:var(--text);line-height:1.65;background:var(--bg);}
        a{text-decoration:none;color:inherit;}
        img{display:block;max-width:100%;}
        .container{max-width:1200px;margin:0 auto;padding:0 5%;}
        header{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line);}

        nav ul{display:flex;gap:2.2rem;list-style:none;align-items:center;}
        nav a{color:var(--text);font-size:.95rem;font-weight:500;transition:color .25s;}
        nav a:hover{color:var(--primary);}
        .nav-cta{background:var(--primary);color:#fff!important;padding:9px 20px;border-radius:999px;font-weight:600;transition:background .25s;}
        .nav-cta:hover{background:var(--primary-dark);}
        .breadcrumb{padding:1.5rem 5%;font-size:.9rem;color:var(--muted);background:var(--bg-soft);}
        .breadcrumb a{color:var(--primary);}
        .detail-wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;padding:3rem 5%;max-width:1200px;margin:0 auto;}
        .main-img{border-radius:var(--radius);overflow:hidden;cursor:zoom-in;}

        .detail-info h1{font-size:1.8rem;color:var(--primary-dark);margin-bottom:1rem;}
